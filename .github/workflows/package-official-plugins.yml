name: Package official plugins

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: "Comma-separated plugin codes to package (empty = all)"
        required: false
        default: ""
  push:
    tags:
      - "plugins-v*"
      # Single-plugin release, e.g. plugin-office-preview-plugin-v0.1.0
      - "plugin-*-v*"

jobs:
  package-plugins:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure zip is available
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Resolve plugin filter
        id: filter
        env:
          INPUT_PLUGINS: ${{ github.event.inputs.plugins }}
        run: |
          plugins="$INPUT_PLUGINS"
          exclude=""
          if [[ "$GITHUB_REF_NAME" =~ ^plugin-(.+)-v[0-9] ]]; then
            plugins="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_NAME" == plugins-v* ]]; then
            # Office preview ships from its own plugin-office-preview-plugin-v* tag (large BetterOffice build).
            exclude="office-preview-plugin"
          fi
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"

      - name: Package official plugins
        run: node scripts/package-official-plugins.js
        env:
          AIPP_PLUGINS: ${{ steps.filter.outputs.plugins }}
          AIPP_PLUGINS_EXCLUDE: ${{ steps.filter.outputs.exclude }}

      - uses: actions/upload-artifact@v4
        with:
          name: official-plugins
          path: dist-official-plugins/**

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/plugins-v') || startsWith(github.ref, 'refs/tags/plugin-')
        with:
          # The desktop updater reads latest.json from the repository's Latest release.
          make_latest: "false"
          files: dist-official-plugins/**
