name: Release

on:
    push:
        tags: [v\d+\.\d+\.\d+]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    create-release:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create-release.outputs.id }}
            release_upload_url: ${{ steps.create-release.outputs.upload_url }}
            release_body: "${{ steps.changelog.outputs.changelog }}"

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Get version
              id: get_version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME}"
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                      VERSION=$(git describe --tags --abbrev=0)
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Generate changelog
              id: changelog
              run: |
                  # 获取当前版本 tag
                  CURRENT_TAG="${{ steps.get_version.outputs.version }}"

                  # 获取上一个版本 tag
                  PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

                  if [ -z "$PREV_TAG" ]; then
                      # 如果没有上一个 tag，获取所有 commit
                      COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
                      CHANGELOG="## 🎉 Release $CURRENT_TAG

                  这是首次发布！

                  ### 📝 更新内容

                  $COMMITS"
                  else
                      # 获取两个 tag 之间的 commits
                      COMMITS=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" --reverse)

                      # 按类型分组 commit
                  FEATURES=$(echo "$COMMITS" | grep -i "^-.*feat\|^-.*新增\|^-.*添加" || echo "")
                  FIXES=$(echo "$COMMITS" | grep -i "^-.*fix\|^-.*修复\|^-.*bug" || echo "")
                  DOCS=$(echo "$COMMITS" | grep -i "^-.*doc\|^-.*文档\|^-.*更新说明" || echo "")
                  REFACTOR=$(echo "$COMMITS" | grep -i "^-.*refactor\|^-.*重构\|^-.*优化" || echo "")
                  OTHER=$(echo "$COMMITS" | grep -v -i "^-.*feat\|^-.*新增\|^-.*添加\|^-.*fix\|^-.*修复\|^-.*bug\|^-.*doc\|^-.*文档\|^-.*更新说明\|^-.*refactor\|^-.*重构\|^-.*优化" || echo "")

                  CHANGELOG="## 🎉 Release $CURRENT_TAG

                  ### ✨ 新功能
                  $FEATURES

                  ### 🐛 Bug 修复
                  $FIXES

                  ### 📚 文档
                  $DOCS

                  ### ♻️ 重构 & 优化
                  $REFACTOR

                  ### 🔧 其他
                  $OTHER"
                  fi

                  # 保存到文件供后续使用
                  echo "$CHANGELOG" > changelog.md

                  # 设置输出（注意处理多行内容）
                  {
                      echo 'changelog<<EOF'
                      cat changelog.md
                      echo EOF
                  } >> $GITHUB_OUTPUT

            - name: Create Release
              id: create-release
              uses: ncipollo/release-action@v1
              with:
                  draft: true
                  name: ${{ steps.get_version.outputs.version }}
                  tag: ${{ steps.get_version.outputs.version }}
                  body: "${{ steps.changelog.outputs.changelog }}"

    build-tauri:
        needs: create-release
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      arch: x86_64
                      target: x86_64-unknown-linux-gnu
                      bundle_target: appimage
                    - os: macos-latest
                      arch: x64
                      target: x86_64-apple-darwin
                      bundle_target: dmg
                    - os: macos-latest
                      arch: arm64
                      target: aarch64-apple-darwin
                      bundle_target: dmg
                    - os: windows-latest
                      arch: x86_64
                      target: x86_64-pc-windows-msvc
                      bundle_target: msi

        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - name: Get version
              id: get_version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME}"
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                      VERSION=$(git describe --tags --abbrev=0)
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Setup protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: "26.1"

            - name: Install dependencies
              run: pnpm install

            - name: Install system dependencies (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev \
                      libayatana-appindicator3-dev librsvg2-dev patchelf \
                      libxdo-dev

            - name: Build Tauri App
              id: build
              uses: tauri-apps/tauri-action@action-v0.6.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  releaseId: ${{ needs.create-release.outputs.release_id }}
                  releaseBody: ${{ needs.create-release.outputs.release_body }}
                  tauriScript: pnpm run tauri
                  args: --target ${{ matrix.target }}

    # 生成并上传 latest.json 文件（带签名）
    generate-latest-json:
        needs: [create-release, build-tauri]
        permissions:
            contents: write
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get_version.outputs.version }}

        steps:
            - uses: actions/checkout@v5

            - name: Get version
              id: get_version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME}"
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                      VERSION=$(git describe --tags --abbrev=0)
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Get release assets and signatures
              id: get_assets
              uses: actions/github-script@v8
              env:
                  release_id: ${{ needs.create-release.outputs.release_id }}
              with:
                script: |
                  const release = await github.rest.repos.getRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: process.env.release_id,
                  });

                  const tagName = release.data.tag_name;
                  const downloadBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;

                  // 收集签名文件
                  const signatures = {};
                  const bundleUrls = {};
                  const urlPreference = {};
                  const sigPreference = {};

                  const detectPlatform = (name) => {
                    const lower = name.toLowerCase();
                    if (lower.includes('appimage')) {
                      return 'linux-x86_64';
                    }
                    if (lower.includes('.msi')) {
                      return 'windows-x86_64';
                    }
                    if (lower.includes('.dmg') || lower.includes('.app.tar.gz')) {
                      if (lower.includes('aarch64') || lower.includes('arm64')) {
                        return 'darwin-aarch64';
                      }
                      if (lower.includes('x64') || lower.includes('x86_64')) {
                        return 'darwin-x86_64';
                      }
                      return 'darwin-x86_64';
                    }
                    return null;
                  };

                  const isPreferredBundle = (name, platform) => {
                    const lower = name.toLowerCase();
                    if (platform === 'linux-x86_64') {
                      return lower.includes('.appimage.tar.gz');
                    }
                    if (platform === 'windows-x86_64') {
                      return lower.includes('.msi.zip');
                    }
                    if (platform && platform.startsWith('darwin')) {
                      return lower.includes('.app.tar.gz');
                    }
                    return false;
                  };

                  for (const asset of release.data.assets) {
                    const name = asset.name;
                    const isSignature = name.endsWith('.sig');
                    const baseName = name.replace(/^bundle\//, '').replace(/\.sig$/, '');
                    const platform = detectPlatform(baseName);
                    if (!platform) {
                      continue;
                    }

                    // .sig 文件是 tauri-action 自动生成的签名
                    if (isSignature) {
                      // 读取签名内容（.sig 文件内容已是 base64 文本）
                      const response = await github.request({
                        method: 'GET',
                        url: asset.url,
                        headers: { accept: 'application/octet-stream' },
                      });
                      const signatureText = Buffer.isBuffer(response.data)
                        ? response.data.toString('utf8').trim()
                        : Buffer.from(response.data).toString('utf8').trim();
                      const preferred = isPreferredBundle(baseName, platform);
                      if (!signatures[platform] || (preferred && !sigPreference[platform])) {
                        signatures[platform] = signatureText;
                        sigPreference[platform] = preferred;
                      }
                      continue;
                    }

                    // 记录 bundle URL
                    const preferred = isPreferredBundle(baseName, platform);
                    if (!bundleUrls[platform] || (preferred && !urlPreference[platform])) {
                      const downloadUrl = encodeURI(`${downloadBase}/${name}`);
                      bundleUrls[platform] = downloadUrl;
                      urlPreference[platform] = preferred;
                    }
                  }

                  console.log('Signatures:', JSON.stringify(signatures, null, 2));
                  console.log('Bundle URLs:', JSON.stringify(bundleUrls, null, 2));

                  // 输出为环境变量供下一步使用
                  const fs = require('fs');
                  fs.writeFileSync('signatures.json', JSON.stringify(signatures, null, 2));
                  fs.writeFileSync('urls.json', JSON.stringify(bundleUrls, null, 2));

            - name: Generate latest.json with signatures
              id: generate_json
              env:
                RELEASE_BODY: ${{ needs.create-release.outputs.release_body }}
              run: |
                # 获取当前时间（ISO 8601 格式）
                PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

                # 读取 changelog
                CHANGELOG="$RELEASE_BODY"
                # 转义换行符为 JSON 字符串
                NOTES_JSON=$(printf '%s' "$CHANGELOG" | jq -Rs .)

                # 读取签名和 URLs
                SIGNATURES=$(cat signatures.json)
                URLS=$(cat urls.json)

                # 获取版本号（去掉 v 前缀）
                VERSION="${{ steps.get_version.outputs.version }}"
                VERSION=${VERSION#v}

                # 检查必需平台资源是否齐全
                for PLATFORM in linux-x86_64 darwin-x86_64 darwin-aarch64 windows-x86_64; do
                  SIG=$(echo "$SIGNATURES" | jq -r --arg p "$PLATFORM" '.[$p] // ""')
                  URL=$(echo "$URLS" | jq -r --arg p "$PLATFORM" '.[$p] // ""')
                  if [ -z "$SIG" ] || [ -z "$URL" ]; then
                    echo "Missing updater asset for $PLATFORM (signature or url)."
                    exit 1
                  fi
                done

                # 生成 latest.json 文件
                cat > latest.json << EOF
                {
                  "version": "${VERSION}",
                  "notes": $NOTES_JSON,
                  "pub_date": "$PUB_DATE",
                  "platforms": {
                    "linux-x86_64": {
                      "signature": "$(echo "$SIGNATURES" | jq -r '.["linux-x86_64"] // ""')",
                      "url": "$(echo "$URLS" | jq -r '.["linux-x86_64"] // ""')"
                    },
                    "darwin-x86_64": {
                      "signature": "$(echo "$SIGNATURES" | jq -r '.["darwin-x86_64"] // ""')",
                      "url": "$(echo "$URLS" | jq -r '.["darwin-x86_64"] // ""')"
                    },
                    "darwin-aarch64": {
                      "signature": "$(echo "$SIGNATURES" | jq -r '.["darwin-aarch64"] // ""')",
                      "url": "$(echo "$URLS" | jq -r '.["darwin-aarch64"] // ""')"
                    },
                    "windows-x86_64": {
                      "signature": "$(echo "$SIGNATURES" | jq -r '.["windows-x86_64"] // ""')",
                      "url": "$(echo "$URLS" | jq -r '.["windows-x86_64"] // ""')"
                    }
                  }
                }
                EOF

                # 格式化 JSON
                jq . latest.json > latest.json.tmp
                mv latest.json.tmp latest.json

                echo "Generated latest.json:"
                cat latest.json

            - name: Upload latest.json to Release
              uses: actions/github-script@v8
              env:
                  release_id: ${{ needs.create-release.outputs.release_id }}
              with:
                script: |
                  const existingAssets = await github.rest.repos.listReleaseAssets({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: process.env.release_id,
                    per_page: 100,
                  });
                  const existing = existingAssets.data.find(asset => asset.name === 'latest.json');
                  if (existing) {
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      release_id: process.env.release_id,
                      asset_id: existing.id,
                    });
                  }
                  const fs = require('fs');
                  const latestJson = fs.readFileSync('latest.json', 'utf8');

                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: process.env.release_id,
                    name: 'latest.json',
                    data: latestJson
                  });

    publish-release:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        needs: [create-release, build-tauri, generate-latest-json]

        steps:
            - name: publish release
              id: publish-release
              uses: actions/github-script@v8
              env:
                  release_id: ${{ needs.create-release.outputs.release_id }}
              with:
                  script: |
                      github.rest.repos.updateRelease({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        release_id: process.env.release_id,
                        draft: false,
                        prerelease: false
                      })
